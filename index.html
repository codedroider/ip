<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeWhatIsMyIP</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #4ade80;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 4px;
            font-weight: 800;
            letter-spacing: -0.05em;
        }

        h1 span {
            color: var(--accent);
        }

        .brand-author {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .ip-card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .ip-card:hover {
            border-color: #475569;
            transform: translateY(-2px);
        }

        .card-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .ip-value {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 1.5rem;
            font-weight: 600;
            word-break: break-all;
            text-align: left;
            color: var(--text-main);
            width: 80%;
        }

        .loading {
            color: var(--text-muted);
            font-style: italic;
            animation: pulse 1.5s infinite;
        }

        .btn-copy {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            background: #273549;
            border: none;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: #334155;
        }

        .btn-copy.copied {
            background: var(--success);
            color: #052e16;
        }

        .hidden-frames {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><span>Code</span>WhatIsMyIP</h1>
        <div class="brand-author">by codedroider</div>
        <div class="subtitle">Ваш текущий сетевой адрес в конфигурации сети</div>

        <div class="ip-card">
            <div class="card-label">IPv4</div>
            <div class="ip-value loading" id="ipv4">Загрузка...</div>
            <button class="btn-copy" id="btn-v4" onclick="copyIp('ipv4', 'btn-v4')" style="display:none;">Копировать</button>
        </div>

        <div class="ip-card">
            <div class="card-label">IPv6</div>
            <div class="ip-value loading" id="ipv6">Загрузка...</div>
            <button class="btn-copy" id="btn-v6" onclick="copyIp('ipv6', 'btn-v6')" style="display:none;">Копировать</button>
        </div>
    </div>

    <div class="hidden-frames">
        <iframe id="frame-v4" src="https://codedroider.github.io/ip/v4"></iframe>
        <iframe id="frame-v6" src="https://codedroider.github.io/ip/v6"></iframe>
    </div>

    <script>
        const regexV4 = /(([0-9]{1,3}\.){3}[0-9]{1,3})/;
        const regexV6 = /(([0-9a-fA-F]{1,4}:){7,7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:)|fe80:(:[0-9a-fA-F]{0,4}){0,4}%[0-9a-zA-Z]{1,}|::(ffff(:0{1,4}){0,1}:){0,1}((25[0-5]|(2[0-4]|1{0,1}[0-7]|[1-9]|0){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-7]|[1-9]|0){0,1}[0-9])|([0-9a-fA-F]{1,4}:){1,4}:((25[0-5]|(2[0-4]|1{0,1}[0-7]|[1-9]|0){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-7]|[1-9]|0){0,1}[0-9]))/;

        function watchFrame(frameId, elementId, buttonId, regex) {
            const frame = document.getElementById(frameId);
            const element = document.getElementById(elementId);
            const button = document.getElementById(buttonId);

            let checkInterval = setInterval(() => {
                try {
                    const frameDoc = frame.contentDocument || frame.contentWindow.document;
                    if (frameDoc && frameDoc.body) {
                        const rawText = frameDoc.body.innerText.trim();
                        const match = rawText.match(regex);

                        if (match && match[1]) {
                            element.textContent = match[1];
                            element.classList.remove('loading');
                            button.style.display = 'block';
                            clearInterval(checkInterval);
                        }
                    }
                } catch (e) {
                    element.textContent = 'Недоступен';
                    element.classList.remove('loading');
                    element.style.color = '#ef4444';
                    clearInterval(checkInterval);
                }
            }, 300);

            setTimeout(() => {
                if (element.classList.contains('loading')) {
                    element.textContent = 'Таймаут или нет IPv6';
                    element.classList.remove('loading');
                    clearInterval(checkInterval);
                }
            }, 7000);
        }

        function copyIp(elementId, buttonId) {
            const ipText = document.getElementById(elementId).textContent;
            const button = document.getElementById(buttonId);
            
            navigator.clipboard.writeText(ipText).then(() => {
                button.textContent = 'Скопировано!';
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.textContent = 'Копировать';
                    button.classList.remove('copied');
                }, 2000);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            watchFrame('frame-v4', 'ipv4', 'btn-v4', regexV4);
            watchFrame('frame-v6', 'ipv6', 'btn-v6', regexV6);
        });
    </script>

</body>
</html>
